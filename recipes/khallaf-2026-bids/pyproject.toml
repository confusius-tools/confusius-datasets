[project]
name = "khallaf-2026-bids"
version = "0.1.0"
description = "Download the Khallaf 2026 fUSI dataset from Edmond without conversion"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["confusius"]

[tool.uv.sources]
# Keep the original Dataverse fetcher when ConfUSIus switches to S3.
confusius = { git = "https://github.com/confusius-tools/confusius.git", rev = "b33094e036b28a7943432a82d724d5f74f7fa50c" }
