[project]
name = "pepe-mariani-2026-template"
version = "1.0.0"
description = "Export a ConfUSIus-loadable fUSI template aligned to the Allen atlas"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "confusius>=0.8.0.dev0",
    "numpy>=2.3.5",
    "simpleitk>=2.5.4",
    "xarray>=2026.4.0",
]

[tool.uv.sources]
confusius = { git = "https://github.com/confusius-tools/confusius.git", branch = "main" }
