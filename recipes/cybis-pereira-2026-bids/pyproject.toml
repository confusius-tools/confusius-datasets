[project]
name = "cybis-pereira-2026-bids"
version = "1.0.0"
description = "Convert Cybis Pereira et al. 2026 fUSI recordings to fUSI-BIDS"
requires-python = ">=3.13"
dependencies = [
    "confusius>=0.8.0.dev0",
    "rich>=14.0.0",
]

[project.scripts]
cybis-convert = "cybis_pereira_2026_bids.cli:convert_main"

[build-system]
requires = ["uv_build>=0.9.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.11",
    "ty>=0.0.32",
]

[tool.uv.sources]
confusius = { git = "https://github.com/confusius-tools/confusius.git", branch = "main" }
